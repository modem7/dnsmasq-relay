#################
##dnsmasq-relay##
#################

services:
  dnsmasq-relay:
    image: modem7/dnsmasq-relay:latest
    container_name: dnsmasq-relay
    environment:
      DHCP_RELAYS: "10.0.10.1,10.0.0.5;10.0.20.1,10.0.0.5;10.0.30.1,10.0.0.5"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    restart: always
    mem_limit: 20m
    mem_reservation: 5m
